name: Putter daily analysis

on:
  schedule:
    - cron: '0 5 * * *'    # morning run (UTC)
    - cron: '0 12 * * *'   # midday refresh for evening kick-offs
  push:
    paths: ['.github/run-pipeline.txt']   # edit that file (first line "demo" or "live") to trigger a run
  workflow_dispatch:
    inputs:
      demo:
        description: 'Run with clearly flagged DEMO data (no API keys needed)'
        type: boolean
        default: false

concurrency: putter-pipeline

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: mode
        name: Decide demo or live
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DEMO: ${{ inputs.demo }}
        run: |
          demo=0
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_DEMO" = "true" ]; then demo=1; fi
          if [ "$EVENT" = "push" ] && head -n1 .github/run-pipeline.txt | grep -qi '^demo'; then demo=1; fi
          echo "demo=$demo" >> "$GITHUB_OUTPUT"
      - id: keys
        name: Check required secrets
        env:
          SB: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AF: ${{ secrets.API_FOOTBALL_KEY }}
          OD: ${{ secrets.ODDS_API_KEY }}
          EVENT: ${{ github.event_name }}
          DEMO: ${{ steps.mode.outputs.demo }}
        run: |
          ok=true
          if [ -z "$SB" ]; then ok=false; echo "::notice::SUPABASE_SERVICE_KEY is not set, skipping."; fi
          if [ "$DEMO" != "1" ] && { [ -z "$AF" ] || [ -z "$OD" ]; }; then ok=false; echo "::notice::API_FOOTBALL_KEY / ODDS_API_KEY not set, skipping (tick demo to run sample data)."; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Unit tests (engine must pass before publishing)
        if: steps.keys.outputs.ok == 'true'
        working-directory: backend
        run: npm test
      - name: Preflight database check
        if: steps.keys.outputs.ok == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rfsmywipfwpwclgjammf.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" "$SUPABASE_URL/rest/v1/config?select=key&limit=1" || true)
          if [ "$code" != "200" ]; then
            echo "::error title=Supabase check failed::HTTP $code from host ${SUPABASE_URL#https://} | key length ${#SUPABASE_SERVICE_KEY}, starts with ${SUPABASE_SERVICE_KEY:0:3} | $(head -c 200 /tmp/r.txt)"
            exit 1
          fi
          echo "Supabase reachable and key accepted"
      - name: Run pipeline
        if: steps.keys.outputs.ok == 'true'
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rfsmywipfwpwclgjammf.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DEMO: ${{ steps.mode.outputs.demo }}
        run: npm run pipeline
